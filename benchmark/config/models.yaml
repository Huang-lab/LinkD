# Models for closed_book / combined / orchestrator conditions.
# Env-key gated: any model whose provider key is absent is skipped automatically.
#
# The retained supplementary run uses gpt-5.4 as its primary OpenAI column.
# claude-sonnet-4-6 was evaluated as a secondary closed-book tier.

openai:
  - gpt-4o-mini
  - gpt-4o
  - gpt-4.1-mini
  - gpt-4.1
  - gpt-5.4              # retained supplementary benchmark model

claude:                    # requires ANTHROPIC_API_KEY
  - claude-sonnet-4-6      # SI secondary closed-book tier
#  - claude-haiku-4-5
#  - claude-opus-4-8

# gemini:                  # requires GOOGLE_API_KEY / GEMINI_FREE_KEY
#   - gemini-2.5-pro       # SI: not accessible from author location
#   - gemini-2.0-flash
