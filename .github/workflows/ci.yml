name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q
      - run: python scripts/check_repository_consistency.py
      - run: python scripts/reviewer_data/validate_package.py --skip-data --skip-outputs
      - run: python benchmark/tests/test_benchmark_smoke.py
      - run: python benchmark/report/performance_report.py
      - run: python benchmark/report/leaderboard.py
      - name: Require retained benchmark reports to match their summaries
        run: git diff --exit-code -- benchmark/results/PERFORMANCE_REPORT.md benchmark/results/leaderboard.md benchmark/results/leaderboard.csv

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interactive_web_server/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: interactive_web_server/frontend/package-lock.json
      - run: npm install --global npm@10.9.8
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run build
      - name: Require committed bundle to match source
        working-directory: .
        run: git diff --exit-code -- interactive_web_server/frontend/dist

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Gitleaks v8.30.1
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --location --retry 3 --proto "=https" --proto-redir "=https" --tlsv1.2 \
            --output "${RUNNER_TEMP}/${archive}" "${release_url}/${archive}"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${RUNNER_TEMP}/${archive}" \
            | sha256sum --check -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          sudo install -m 0755 "${RUNNER_TEMP}/gitleaks" /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan complete Git history
        run: gitleaks git --redact --verbose .
