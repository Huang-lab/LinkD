services:
  - type: web
    name: linkd-agent
    runtime: python
    region: oregon
    plan: starter
    # Frontend is prebuilt and committed (interactive_web_server/frontend/dist/),
    # so the build only installs Python deps — no npm build (saves pipeline minutes).
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/download_data.py && cd interactive_web_server/backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_DIR
        value: /opt/render/project/src/data/Database
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_FREE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
    disk:
      name: linkd-data
      mountPath: /opt/render/project/src/data
      # Atomic dataset upgrades temporarily require space for old + new copies.
      sizeGB: 40
